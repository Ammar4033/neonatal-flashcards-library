<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>توازن السوائل والشوارد عند حديثي الولادة</title>

<style>
:root{
  --card-bg:#0B2348;
  --text-bg:#CFE8FF;
  --text-color:#0B0F1A;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}
body{
  background:#040B18;
  font-family: system-ui, Tahoma, Arial;
  display:flex;
  justify-content:center;
  align-items:center;
}
.app{
  width:100%;
  max-width:820px;
  height:100%;
  padding:16px;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.card-wrap{
  flex:1;
  perspective:1400px;
  touch-action: pan-y;
}
.card{
  position:relative;
  width:100%;
  height:100%;
  max-height:560px;
  margin:auto;
  background:var(--card-bg);
  border-radius:26px;
  transform-style:preserve-3d;
  transition:transform .5s;
}
.card.is-flipped{transform:rotateY(180deg)}
.face{
  position:absolute;
  inset:0;
  padding:22px;
  backface-visibility:hidden;
  display:flex;
  flex-direction:column;
}
.face.back{transform:rotateY(180deg)}
.badge{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:900;
  color:white;
  font-size:17px;
}
.badge-left{
  display:flex;
  gap:8px;
  align-items:center;
}
.progress{
  font-size:15px;
  background:rgba(255,255,255,.12);
  padding:6px 12px;
  border-radius:12px;
}
.bubble{
  flex:1;
  margin-top:14px;
  background:var(--text-bg);
  color:var(--text-color);
  border-radius:20px;
  padding:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:right;
}
pre{
  margin:0;
  white-space:pre-wrap;
  direction:rtl;
  text-align:right;
  font:inherit;
  font-size:clamp(21px, 2.6vw, 28px);
  line-height:1.9;
}
.controls{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:12px;
  align-items:center;
}
button{
  padding:14px 18px;
  border-radius:18px;
  border:none;
  background:#1a3b6e;
  color:white;
  font-weight:900;
  font-size:15px;
}
button.center{background:#25518f}
button.read{grid-column:1 / -1;background:#163a6b}
</style>
</head>

<body>
<div class="app">

<div class="card-wrap" id="wrap">
  <div class="card" id="card">

    <div class="face front">
      <div class="badge">
        <div class="badge-left">🧐 سؤال</div>
        <div class="progress" id="pf"></div>
      </div>
      <div class="bubble"><pre id="frontText"></pre></div>
    </div>

    <div class="face back">
      <div class="badge">
        <div class="badge-left">🤓 جواب</div>
        <div class="progress" id="pb"></div>
      </div>
      <div class="bubble"><pre id="backText"></pre></div>
    </div>

  </div>
</div>

<div class="controls">
  <button id="prev">⬅️ السابق</button>
  <button id="flip" class="center">🔄 اقلب</button>
  <button id="next">التالي ➡️</button>
  <button id="read" class="read">🔊 اقرأ</button>
</div>

</div>

<script>
/* صوت */
const ctx=new (window.AudioContext||window.webkitAudioContext)();
function sound(f,d=0.08){
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.frequency.value=f;
  o.connect(g); g.connect(ctx.destination);
  g.gain.value=0.05;
  o.start(); o.stop(ctx.currentTime+d);
}

/* ===== البطاقات (افتتاحية + 18 + ختامية) ===== */
const cards=[
{front:`كم يشكل ماء الجسم الكلي (TBW) من وزن الجسم لدى حديثي الولادة بتمام الحمل، وكم قد يصل عند الخدّج؟`,
 back:`يقارب 75% من وزن الجسم لدى حديثي الولادة بتمام الحمل، وقد يصل إلى 85%–90% لدى حديثي الولادة الخدّج.`},

{front:`إلى أي قسمين أساسيين يُقسَّم ماء الجسم الكلي (TBW)؟`,
 back:`الماء داخل الخلايا (ICW) والماء خارج الخلايا (ECW)، وECW يتكون من الماء داخل الأوعية (intravascular) والماء الخلالي (interstitial).`},

{front:`ما نسبة فقدان الوزن المتوقعة خلال الأيام 3–5 الأولى من الحياة عند تمام الحمل وعند الخدّج؟ ومتى يُعد الفقد مفرطاً؟`,
 back:`5%–10% من وزن الولادة لدى حديثي الولادة بتمام الحمل، و10%–15% لدى الخدّج. ويُعد فقدان >15% من وزن الولادة خلال الأسبوع الأول مفرطاً ويستلزم إعادة تقييم توازن ماء الجسم بعناية.`},

{front:`ما الهدف من تدبير السوائل الوريدية عند الخدّج خلال الأسبوع الأول من ناحية توازن السوائل والوزن؟`,
 back:`السماح بخسارة وزن %10–%15 خلال الأسبوع الأول مع الحفاظ على توازن (TBW) وتوازن الشوارد.`},

{front:`كيف يُعرَّف الفقد غير المحسوس للماء (IWL)؟`,
 back:`هو فقد الماء عن طريق التبخر ويحدث بشكل أساسي عبر الجلد والأغشية المخاطية (ثلثان) وعبر السبيل التنفسي (ثلث).`},

{front:`ما تقديرات الفقد غير المحسوس للماء خلال الأسبوع الأول ضمن بيئة حياد حراري لوزن الولادة <750 غ و>2000 غ؟`,
 back:`<750 غ: 200–100 مل/كغ/يوم
>2000 غ: 20–15 مل/كغ/يوم`},

{front:`ما حجم سوائل التسريب الوريدي في اليوم الأول من الحياة لحديثي الولادة بتمام الحمل المحتاجين لمعالجة بسوائل التسريب الوريدية؟`,
 back:`60–80 مل/كغ/يوم.`},

{front:`ما حجم سوائل التسريب الوريدي في اليوم الأول من الحياة للخدّج LBW (<1500 غ)؟`,
 back:`60–80 مل/كغ/يوم.`},

{front:`ما حجم سوائل التسريب الوريدي في اليوم الأول من الحياة للـ VLBW (1000–1500 غ)؟`,
 back:`80–100 مل/كغ/يوم.`},

{front:`ما حجم سوائل التسريب الوريدي في اليوم الأول من الحياة للـ ELBW (<1000 غ) ضمن حاضنات مغلقة مزدوجة الجدار مرطّبة (%) أو حاضنات هجينة مرطّبة؟`,
 back:`50–80 مل/كغ/يوم.`},

{front:`ما المعيار لتوازن ماء الجسم الكلي (TBW)؟`,
 back:`قيم الصوديوم 135–145 L/mEq + أزمولية المصل 285 (mOsm ±3(kg/mOsm.`},

{front:`بعد التأكد من تحمّل سوائل التسريب الوريدية خلال الأيام 2 إلى 7 من الحياة، ما أهداف سوائل التسريب الوريدية؟`,
 back:`خسارة وزن متوقعة حسب العمر الحملي والوزن، وتأكيد قيم شوارد مصل طبيعية، واستمرار إدرار البول 2–3 مل/كغ/ساعة.`},

{front:`ما حجم سوائل التسريب الوريدية عند حديثي الولادة بتمام الحمل خلال الأيام 2 إلى 7 من الحياة؟`,
 back:`80–120 مل/كغ/يوم، ويمكن زيادته إلى 120–160 مل/كغ/يوم بحلول نهاية الأسبوع حسب التحمل أو بحسب الاحتياجات وفق المراقبة.`},

{front:`ما تدبير الصوديوم خلال الأسبوع الأول من الحياة من حيث تعديل الوارد اليومي والهدف؟`,
 back:`زيادة أو إنقاص الوارد اليومي بمقدار 20–40 مل/كغ/يوم اعتماداً على تبدلات الوزن وقيم صوديوم المصل، مع محاولة إبقاء صوديوم المصل 135–140 ملمك/لتر، ولا تحتاج إضافة الصوديوم عادة خلال أول 2–3 أيام.`},

{front:`ما الحاجة اليومية للبوتاسيوم، وما هدف بوتاسيوم المصل؟`,
 back:`الحاجة اليومية 1–2 mEq/كغ/يوم وفق مراقبة المصل، وهدف بوتاسيوم المصل 4.0–5.0 ملمك/لتر.`},

{front:`متى يبدأ إعطاء البوتاسيوم خلال الأيام الأولى؟`,
 back:`لا يبدأ إعطاء البوتاسيوم حتى اليوم الثاني أو الثالث، وفقط عند تأكيد وظيفة كلوية طبيعية بإدرار بول كافٍ مع قيم شوارد مصل طبيعية.`},

{front:`ما مبدأ المعالجة في فرط صوديوم الدم ولماذا يجب تجنب التصحيح السريع؟`,
 back:`الهدف الأول تعويض الماء الحر، والهدف الثاني الحفاظ على توازن Na+، ويجب إنجاز الهدفين دون تبدلات سريعة في ICW/ECW أو الصوديوم لأن التصحيح السريع المفرط قد يؤدي إلى اختلاجات.`},

{front:`ما الحد الأقصى المسموح لخفض صوديوم المصل في علاج فرط صوديوم الدم وما زمن التصحيح المستهدف؟`,
 back:`خفض Na+ المصلي بمقدار لا يزيد عن 0.5 ملمك/لتر/ساعة أو أقل، مع استهداف زمن تصحيح إجمالي 24 إلى 48 ساعة (حسب مستوى الصوديوم الأساسي).`},

{front:`متى يتأخر إدرار البول بعد الولادة؟`,
 back:`في حالة متلازمة الضائقة التنفسية لدى حديثي الولادة (RDS)، وعند الأطفال الذين تعرضوا لشدّة أثناء الولادة (stress intrapartum Significant).`},

{front:`ما مشكلة محلول كلوريد الصوديوم 0.9% عند الخدّج خلال أول 48 ساعة؟`,
 back:`يسبب تحميل مهم من شاردة الكلور وقد يفاقم الحماض الاستقلابي.`},

{front:`ما طبيعة تركيب السائل المقترح في اليوم الثاني ضمن “متطلبات حجم السوائل الطبيعية”؟`,
 back:`محلول الغلوكوز %10 مع البوتاسيوم بمقدار 10 ميلي مول في 500 مل من المحلول، ويُعتمد ذلك على نتائج تحليل الشوارد المصلية، أو استخدام PN.`},

{front:`ما أحجام السوائل (مل/كغ/يوم) المقترحة حسب اليوم من الحياة ووزن الولادة (<1000غ و≥1000غ) حسب الدلائل الإرشادية البريطانية؟`,
 back:`اليوم 1: <1000غ 90، ≥1000غ 60
اليوم 2: <1000غ 120، ≥1000غ 90
اليوم 3: <1000غ 150، ≥1000غ 120
اليوم 4: <1000غ 150، ≥1000غ 150`},

{front:`ما الذي يُنصح به بخصوص رطوبة الحاضنة إذا كان العمر الحملي < 29 أسبوع؟`,
 back:`اضبط رطوبة الحاضنة ≥ %60.`},

{front:`ما إعداد الترطيب الأقصى الموصى به عند وضع الطفل على CPAP أو على التهوية الميكانيكية؟`,
 back:`اضبط المرطب (Humidifier) على درجة حرارة 39°م لضمان الترطيب الأقصى للغاز المستنشق.`},

{front:`ما العواقب السيئة لفقد الماء المفرط عبر الجلد عند الخدّج؟`,
 back:`قد يؤدي إلى انخفاض الحرارة وفقدان السعرات والتجفاف، وقد يسبب فقدان وزن مفرط وفرط صوديوم الدم.`},

{front:`ما خطة مراقبة الوزن عند حديثي الولادة في وحدة الرعاية المشددة حسب الدلائل الإرشادية البريطانية؟`,
 back:`عند القبول.
بشكل يومي لأطفال العناية المركزة (NICU babies)، ومرتين يومياً إذا كان هناك مشكلة في توازن السوائل (Fluid balance).
استخدم موازين مدمجة ضمن الحاضنة إن أمكن (In-line scales).`},

{front:`ما خطة مراقبة مستوى الصوديوم المصلي لأطفال العناية المركزة حسب الدلائل الإرشادية البريطانية؟`,
 back:`يومياً لأطفال العناية المركزة، ومرتين يومياً إذا كان هناك اضطرابات كهرلية/شاردية، أو كان العمر ≤ 26 أسبوعاً حملياً.`},

{front:`ما أهمية توازن الصوديوم الإيجابي بعد بدء إدرار البول عند حديثي الولادة؟`,
 back:`يُعد ضرورياً لنمو الأنسجة.`},

{front:`ما الذي قد يحدث لصوديوم الجسم عند الخدّج المولودين بعمر حملي < 29 أسبوع؟`,
 back:`قد يفقدون كمية مفرطة من الصوديوم عبر الكليتين غير الناضجتين. وقد تصل حاجتهم اليومية من الصوديوم الى 12 ملمك/كغ/يوم خاصة عند شديدي الخداج ELBW.`},

{front:`ما خطة متابعة الكرياتينين المصلي لأطفال العناية المركزة حسب الدلائل الإرشادية البريطانية؟`,
 back:`قياسه يومياً، والأهم متابعة الاتجاه (Trend)؛ قد يميل للارتفاع خلال الأيام 2–3 الأولى ثم ينخفض تدريجياً لاحقاً، وعدم انخفاضه بعد الولادة يُعد مهماً سريرياً.`},

{front:`ما خطة تقييم إدرار البول لأطفال العناية المركزة، وما المجال الذي يعبر عن إماهة طبيعية حسب الدلائل الإرشادية البريطانية؟`,
 back:`إعادة التقييم كل 8 ساعات، و 2–4 مل/كغ/ساعة تعبر عن إماهة طبيعية.`},

{front:`ما أهمية مراقبة البولة المصلية في مراقبة توازن السوائل عند حديثي الولادة؟`,
 back:`لا تفيد البولة المصلية في مراقبة توازن السوائل، حيث تعكس حالة التغذية وتحميل النيتروجين (Nitrogen load).`},

{front:`كم تساوي كمية الصوديوم (ملمك/مل) في محلول كلوريد الصوديوم %3؟`,
 back:`0.5 ملمك/مل.`},

{front:`كم تساوي كمية البوتاسيوم/الكلور (mEq/مل) في محلول كلوريد البوتاسيوم %15؟`,
 back:`2 mEq/مل من كلٍّ من البوتاسيوم والكلور.`},

];

let i=0, flipped=false;
const card=document.getElementById("card");
const wrap=document.getElementById("wrap");
const ft=document.getElementById("frontText");
const bt=document.getElementById("backText");
const pf=document.getElementById("pf");
const pb=document.getElementById("pb");

function render(){
  ft.textContent=cards[i].front;
  bt.textContent=cards[i].back;
  pf.textContent=pb.textContent=`${i+1} / ${cards.length}`;
  flipped=false;
  card.classList.remove("is-flipped");
}
render();

function toggleFlip(){
  flipped=!flipped;
  card.classList.toggle("is-flipped",flipped);
  sound(800,0.1);
}

/* أزرار */
prev.onclick=()=>{if(i>0){i--;render();sound(420)}};
next.onclick=()=>{if(i<cards.length-1){i++;render();sound(520)}};
flip.onclick=toggleFlip;
read.onclick=()=>{
  sound(950,0.05);
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(flipped?cards[i].back:cards[i].front);
  u.lang='ar';
  speechSynthesis.speak(u);
};

/* Tap = قلب / Swipe = تنقّل (مُحسّن للموبايل) */
let sx=0, sy=0, lx=0, ly=0, tracking=false;

const SWIPE_X = 55;         // عتبة السحب الأفقي (px)
const DOMINANCE = 1.2;      // لازم يكون السحب الأفقي أوضح من العمودي

function onStart(x,y){
  sx=lx=x; sy=ly=y; tracking=true;
}
function onMove(x,y){
  if(!tracking) return;
  lx=x; ly=y;
}
function onEnd(x,y){
  if(!tracking) return;
  tracking=false;
  const dx=(x??lx)-sx;
  const dy=(y??ly)-sy;

  // Swipe: يسار = التالي / يمين = السابق
  if(Math.abs(dx) > SWIPE_X && Math.abs(dx) > Math.abs(dy)*DOMINANCE){
    (dx < 0) ? next.onclick() : prev.onclick();
    return;
  }
  // Tap / حركة بسيطة = قلب
  toggleFlip();
}

/* Pointer events (الأفضل والأكثر ثباتاً) */
wrap.addEventListener("pointerdown", (e)=>{
  try{ wrap.setPointerCapture(e.pointerId); }catch(_){}
  onStart(e.clientX, e.clientY);
}, {passive:true});

wrap.addEventListener("pointermove", (e)=>{ onMove(e.clientX, e.clientY); }, {passive:true});
wrap.addEventListener("pointerup",   (e)=>{ onEnd(e.clientX, e.clientY); }, {passive:true});
wrap.addEventListener("pointercancel",(e)=>{ onEnd(e.clientX, e.clientY); }, {passive:true});

/* Touch fallback (فقط إذا ما في PointerEvent) */
if(!("PointerEvent" in window)){
  wrap.addEventListener("touchstart", (e)=>{
    const t=e.changedTouches[0];
    onStart(t.clientX, t.clientY);
  }, {passive:true});

  wrap.addEventListener("touchmove", (e)=>{
    const t=e.changedTouches[0];
    onMove(t.clientX, t.clientY);
  }, {passive:true});

  wrap.addEventListener("touchend", (e)=>{
    const t=e.changedTouches[0];
    onEnd(t.clientX, t.clientY);
  }, {passive:true});

  wrap.addEventListener("touchcancel", (e)=>{
    const t=e.changedTouches[0];
    onEnd(t.clientX, t.clientY);
  }, {passive:true});
}
</script>
</body>
</html>
